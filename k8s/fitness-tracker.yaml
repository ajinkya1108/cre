apiVersion: v1
kind: Namespace
metadata:
  name: fitness
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: fitness
type: Opaque
stringData:
  POSTGRES_USER: fitness
  POSTGRES_PASSWORD: change-me-before-production
  POSTGRES_DB: fitness
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: fitness
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fitness
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: postgres-secret } }]
          env:
           - name: PGDATA
             value: /var/lib/postgresql/data/pgdata
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fitness
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-tracker
  namespace: fitness
spec:
  replicas: 2
  selector:
    matchLabels: { app: fitness-tracker }
  template:
    metadata:
      labels: { app: fitness-tracker }
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/fitness-tracker:1.0.0 # replace before applying
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/fitness
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: fitness-tracker
  namespace: fitness
spec:
  type: ClusterIP
  selector: { app: fitness-tracker }
  ports:
    - port: 80
      targetPort: 8080
